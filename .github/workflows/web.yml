name: Web

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "crates/agent/**"
      - "crates/agent-wasm/**"
      - "scripts/check-agent-size.mjs"
      - ".github/workflows/web.yml"
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/**"
      - "crates/agent/**"
      - "crates/agent-wasm/**"
      - "scripts/check-agent-size.mjs"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm --dir apps/web exec tsc --noEmit

      - name: Test
        run: pnpm --dir apps/web exec vitest run

      - name: Build
        run: pnpm --dir apps/web run build

      # Enforces apps/web/budget.json against the emitted chunks. Fails rather
      # than skips when no build output exists.
      - name: Budget
        run: pnpm --dir apps/web run check:budget

  # The web surface depends on a Rust core compiled to WebAssembly. Without this
  # job a break in `crates/agent` would be discovered only when someone happened
  # to open the workspace in a browser.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked

      - name: Core tests
        run: cargo test -p edapex-agent

      - name: Native size gate
        run: node scripts/check-agent-size.mjs

      # Builds the bundle, runs wasm-bindgen, and fails if either the wasm or the
      # JS glue exceeds its compressed budget.
      - name: Build agent runtime
        run: pnpm --dir apps/web run build:agent-runtime

      - name: Agent runtime must exist
        run: |
          test -f apps/web/public/agent-runtime/edapex_agent_wasm_bg.wasm
          test -f apps/web/public/agent-runtime/edapex_agent_wasm.js

      # The browser suite boots the real runtime, so it consumes this artifact
      # instead of rebuilding wasm-bindgen in a second job.
      - name: Upload agent runtime
        uses: actions/upload-artifact@v4
        with:
          name: agent-runtime
          path: apps/web/public/agent-runtime/
          retention-days: 1

  # Contract parity: the Rust wire types and the TypeScript fixtures must agree.
  # This is the check that catches a rename on one side only.
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Contract parity
        run: cargo test -p edapex-agent --test contract_parity

  # Behavioural checks that a type check and a bundle build cannot see. `/workspace`
  # returned 500 to every request while both of those were green.
  e2e:
    runs-on: ubuntu-latest
    needs: wasm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Download agent runtime
        uses: actions/download-artifact@v4
        with:
          name: agent-runtime
          path: apps/web/public/agent-runtime/

      - name: Install Chromium
        run: pnpm --dir apps/web exec playwright install --with-deps chromium

      # The shell does not export NODE_ENV here; the Playwright config pins it to
      # development. `production` would make react-dom resolve its production
      # server build while Vite still emits the dev JSX runtime, and every server
      # render throws `dispatcher.getOwner is not a function`.
      - name: Browser tests
        run: pnpm --dir apps/web exec playwright test

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: apps/web/test-results/
          retention-days: 7
