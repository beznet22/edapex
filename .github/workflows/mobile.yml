name: Android

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "crates/**"
      - "packages/contracts/**"
      - "scripts/fetch-rusto-models.mjs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.13113456"

      - name: Install Rust Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch pinned OCR models
        run: node scripts/fetch-rusto-models.mjs

      - name: Build Android debug
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/29.0.13113456"
          pnpm --dir apps/desktop run android:build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: edapex-work-debug-apk
          path: apps/desktop/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          if-no-files-found: error
