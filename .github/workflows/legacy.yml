name: Legacy app

# The root SvelteKit app is the one that actually serves production today. It had
# no CI at all, which is how its Docker build broke on 2026-11-14 (a module-scope
# libSQL connection at postbuild analysis) and went unnoticed for months: the last
# successful `docker.yml` run was 2026-08-03.
#
# This job builds it the same way the image does, so a break is caught on the PR
# rather than on the next deploy to main.

on:
  pull_request:
    paths:
      - "src/**"
      - "static/**"
      - "bin/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "svelte.config.js"
      - "vite.config.ts"
      - "tsconfig.json"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/legacy.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "static/**"
      - "bin/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "svelte.config.js"
      - "vite.config.ts"
      - "tsconfig.json"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/legacy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # `--frozen-lockfile` matches the Dockerfile. `svelte-kit sync` is part of
      # `prepare`; without scripts it has to run explicitly, which is what the
      # Docker build gets for free.
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate SvelteKit types
        run: pnpm exec svelte-kit sync

      # The same two placeholders the Dockerfile's builder stage sets. Both are
      # read at module scope during postbuild analysis: the Telegram adapter wants
      # a bot token, and Mastra storage opens libSQL.
      - name: Build
        env:
          TELEGRAM_BOT_TOKEN: placeholder
          MASTRA_DB_URL: file:/tmp/build-mastra.db
        run: pnpm run build

      - name: Build artifact exists
        run: test -f build/index.js

  # The image is what actually deploys, so the Dockerfile is built too — but only
  # once the plain build passes, because a Docker failure is much slower to read.
  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: edapex-legacy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
