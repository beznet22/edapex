name: Legacy app

# The root SvelteKit app is what serves production today, and it had no CI at all.
# `docker.yml` last succeeded on 2026-08-03 — not because it was broken, but
# because nothing had been pushed to main since. That gap is the point: without a
# workflow, "is the legacy app still buildable?" had no answer in either direction,
# and I answered it wrongly from the gap alone.
#
# This job builds it the same way the image does, so the answer is a check result
# rather than an inference.

on:
  pull_request:
    paths:
      - "legacy/**"
      - ".github/workflows/legacy.yml"
  push:
    branches:
      - main
    paths:
      - "legacy/**"
      - ".github/workflows/legacy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # `--frozen-lockfile` matches the Dockerfile. `svelte-kit sync` is part of
      # `prepare`; without scripts it has to run explicitly, which is what the
      # Docker build gets for free.
      - name: Install
        working-directory: legacy
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate SvelteKit types
        working-directory: legacy
        run: pnpm exec svelte-kit sync

      # The Telegram adapter validates `botToken` at module scope, and postbuild
      # analysis imports it. MASTRA_DB_URL is set because the bundled `db-url`
      # module resolves its project root from its own chunk location, which lands
      # outside the repo; pinning it here makes the database path deterministic.
      - name: Build
        working-directory: legacy
        env:
          TELEGRAM_BOT_TOKEN: placeholder
          MASTRA_DB_URL: file:/tmp/build-mastra.db
        run: pnpm run build

      - name: Build artifact exists
        working-directory: legacy
        run: test -f build/index.js

  # The image is what actually deploys, so the Dockerfile is built too — but only
  # once the plain build passes, because a Docker failure is much slower to read.
  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./legacy
          file: ./legacy/Dockerfile
          platforms: linux/amd64
          push: false
          tags: edapex-legacy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
