name: Build, Push & Tag (Staging)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write      # required to push git tags
      packages: write      # required to push to GHCR
      id-token: write

    steps:
      # ─────────────────────────────────────────────
      # Checkout repo with full history for tagging
      # ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─────────────────────────────────────────────
      # Docker setup
      # ─────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────────────────────────
      # Extract Docker metadata
      # ─────────────────────────────────────────────
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      # ─────────────────────────────────────────────
      # Build & Push Docker image
      # ─────────────────────────────────────────────
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ─────────────────────────────────────────────
      # Create semantic version tag
      # ─────────────────────────────────────────────
      - name: Create semantic version tag
        id: tag
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)

          if [ -z "$LAST_TAG" ]; then
            echo "No previous tag reachable (likely history rewrite). Starting from 0.1.0"
            NEW_VERSION="0.1.0"
          else
            echo "Previous tag: $LAST_TAG"
            VERSION="${LAST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            PATCH=$((PATCH + 1))
            NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "new_tag=v${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          git tag -f "v${NEW_VERSION}"
          echo "Created tag: v${NEW_VERSION}"

      # ─────────────────────────────────────────────
      # Push the tag to GitHub (triggers Dokploy)
      # ─────────────────────────────────────────────
      - name: Push git tag
        run: git push origin --force ${{ steps.tag.outputs.new_tag }}

      # ─────────────────────────────────────────────
      # Optional: Debug local tags
      # ─────────────────────────────────────────────
      - name: List local tags
        run: git tag
