[package]
name = "edapex-desktop"
version = "0.1.0"
description = "EdApex Work desktop shell"
edition = "2021"
license = "MIT"

[lib]
name = "edapex_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
edapex-core = { path = "../../../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
