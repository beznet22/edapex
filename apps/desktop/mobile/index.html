<!doctype html>
<html lang="en" data-theme-mode="system">
  <head>
    <meta charset="utf-8" />
    <!--
      `viewport-fit=cover` is what makes `env(safe-area-inset-*)` resolve at all.
      `interactive-widget=resizes-content` makes the layout viewport shrink with the IME,
      so `dvh` and `position: fixed` both do the right thing without a JS observer.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#fbfbfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161a24" media="(prefers-color-scheme: dark)" />
    <title>EdApex Work</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
