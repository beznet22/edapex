[package]
name = "edapex-agent"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4", "js"] }

# `wasm32-unknown-unknown` has no executor, so a detached turn is spawned through
# wasm-bindgen there. Native hosts use the ambient tokio runtime.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
