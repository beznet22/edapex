[package]
name = "edapex-agent"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
infinity-agent-core.workspace = true
infinity-host.workspace = true
infinity-provider-protocol.workspace = true
rap-protocol.workspace = true
async-stream = { version = "0.3", default-features = false }
async-trait = { version = "0.1", default-features = false }
edapex-store = { path = "../store" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
uuid = { version = "1", features = ["v4", "js"] }

# The browser owns a separate OPFS projection and IndexedDB core stores. The
# native-only sync crate enables Tokio filesystem features even with defaults off.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
infinity-sync.workspace = true

# `wasm32-unknown-unknown` has no executor, so a detached turn is spawned through
# wasm-bindgen there. Native hosts use the ambient tokio runtime.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
