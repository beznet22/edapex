[package]
name = "ocr-bench"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
image = "0.25"
ocrs = "0.14.0"
rten = "0.28.0"
rusto-rs = { version = "0.3.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"
