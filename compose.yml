services:
  db:
    image: mariadb:10.11
    environment:
      MYSQL_ROOT_PASSWORD: rootPASSW0rd_dev
      MYSQL_DATABASE: edapex_v2
      MYSQL_USER: edapex
      MYSQL_PASSWORD: devpassword
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  adminer:
    image: adminer
    restart: always
    ports:
      - "8089:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db

  schema-push:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_V2_URL=mysql://edapex:devpassword@db:3306/edapex_v2
    depends_on:
      - db
    restart: "no"

volumes:
  db_data:
