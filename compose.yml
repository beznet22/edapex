services:
  edapex:
    image: ghcr.io/beznet22/edapex:latest
    pull_policy: always
    user: "${UID}:${GID}"
    expose:
      - 3000
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SIGN_SECRET=${JWT_SIGN_SECRET}
      - JWE_ENC_SECRET=${JWE_ENC_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
      - MASTRA_DB_URL=file:/app/storage/edapex-mastra.db
    volumes:
      - ${STORAGE_DIR}/.workspaces:/app/workspaces/
      - ${STORAGE_DIR}/static:/app/static/
    restart: unless-stopped
